name: Build and push Docker image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev autoconf

      - name: Build SHAPEIT static binaries and Docker image
        run: |
          cd docker
          bash build.sh

      - name: Identify built image
        run: |
          docker images
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "^shapeit5_" | head -n 1)
          if [ -z "$IMAGE_ID" ]; then
            echo "No shapeit5_* image found"
            exit 1
          fi
          IMAGE_TAG=$(echo "$IMAGE_ID" | cut -d: -f1)
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Found image: $IMAGE_ID (tag suffix: $IMAGE_TAG)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          docker tag "$IMAGE_ID" "$DH_USER/shapeit:latest"
          docker tag "$IMAGE_ID" "$DH_USER/shapeit:$IMAGE_TAG"
          docker push "$DH_USER/shapeit:latest"
          docker push "$DH_USER/shapeit:$IMAGE_TAG"
