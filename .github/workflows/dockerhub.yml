name: Build and push Docker image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zlib1g-dev libbz2-dev liblzma-dev libcurl4-openssl-dev autoconf

      - name: Build SHAPEIT Docker image
        run: |
          cd docker
          bash build.sh

      - name: Show Docker images and files
        run: |
          docker images
          find . -name "*.tar.gz" -print

      - name: Load image from SHAPEIT tarball
        run: |
          TARBALL=$(find docker -name "shapeit5_*.tar.gz" | head -n 1)
          echo "Found tarball: $TARBALL"
          docker load -i "$TARBALL"

      - name: Find built image
        run: |
          docker images
          IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "^shapeit5_" | head -n 1)
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "Found image: $IMAGE_ID"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          docker tag "$IMAGE_ID" jlin42/shapeit:latest
          docker push jlin42/shapeit:latest
